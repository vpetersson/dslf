name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # Rust tests - runs in parallel with test-bun
  # ============================================================================
  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Show Rust version
        run: |
          rustc --version
          cargo --version

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Test binary execution
        run: |
          ./target/release/dslf --help
          echo "Binary execution test passed"

      - name: Test configuration validation
        run: |
          # Create a test config with a reliable URL for CI validation
          echo "url,target,status" > test-ci.csv
          echo "/github,https://github.com,301" >> test-ci.csv
          ./target/release/dslf --validate --config test-ci.csv || echo "Validation completed (may fail in CI environment)"
          rm test-ci.csv

  # ============================================================================
  # TypeScript/Bun tests - runs in parallel with test-rust
  # ============================================================================
  test-bun:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Run TypeScript linting
        run: bun run lint:check

      - name: Run TypeScript formatting check
        run: bun run format:check

      - name: Run TypeScript tests
        run: bun run test

      - name: Build frontend assets
        run: bun run build

  # ============================================================================
  # Docker build - waits for both test jobs
  # ============================================================================
  # ============================================================================
  # Docker
  #
  # arm64 used to be built on the x86 runner through QEMU, and stage 2 of the
  # runtime Dockerfile is a full `cargo build --release` of axum, tokio and
  # reqwest. Emulating that compile was essentially the entire pipeline: on the
  # last two master runs the Rust and TypeScript jobs finished in well under a
  # minute each while the Docker job took 33m25s and 37m41s.
  #
  # Each architecture is now built on a runner of its own architecture, so
  # nothing is emulated. Because the two halves finish on different machines,
  # they are pushed by digest and a final job assembles the manifest list that
  # gives the tags their multi-arch meaning.
  # ============================================================================
  docker-pr:
    name: Docker Build (PR check)
    runs-on: ubuntu-24.04
    needs: [test-rust, test-bun]
    if: github.event_name != 'push'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Unchanged from before: a pull request builds amd64 only and never
      # pushed, so PR feedback was already quick. This keeps that.
      - name: Build runtime image (amd64 only)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/${{ github.repository_owner }}/dslf:${{ github.sha }}

      - name: Test Docker container
        run: |
          docker run --rm ghcr.io/${{ github.repository_owner }}/dslf:${{ github.sha }} --help
          echo "Docker container test passed"

  docker-build:
    name: Docker Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [test-rust, test-bun]
    if: github.event_name == 'push'
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            # Free for public repositories. This is the whole point of the
            # change: a native arm64 machine rather than emulation.
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # push-by-digest uploads the layers and returns a digest without claiming
      # any tag. The tags are attached later, once both architectures exist.
      - name: Build and push runtime image by digest
        id: runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/dslf,push-by-digest=true,name-canonical=true,push=true

      - name: Build and push builder image by digest
        id: builder
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.builder
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=builder-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=builder-${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/dslf,push-by-digest=true,name-canonical=true,push=true

      # The digest is the filename, but upload-artifact rejects ":" in paths, so
      # store the bare hash and put the "sha256:" prefix back when the manifest
      # is assembled.
      - name: Record digests
        env:
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          BUILDER_DIGEST: ${{ steps.builder.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests/runtime /tmp/digests/builder
          touch "/tmp/digests/runtime/${RUNTIME_DIGEST#sha256:}"
          touch "/tmp/digests/builder/${BUILDER_DIGEST#sha256:}"
          ls -R /tmp/digests

      - name: Upload digests
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Docker Manifest
    runs-on: ubuntu-24.04
    needs: [docker-build]
    if: github.event_name == 'push'
    permissions:
      packages: write
      contents: read

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Prepare Docker tags
        id: meta
        run: |
          CLEAN_REF=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          echo "clean_ref=${CLEAN_REF}" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref_name }}" == "master" ]]; then
            echo "version_tag=latest" >> $GITHUB_OUTPUT
          else
            echo "version_tag=${CLEAN_REF}" >> $GITHUB_OUTPUT
          fi

      # One manifest list per repository, built from the per-architecture
      # digests. The tag set is the same as before this change.
      - name: Create manifest lists
        env:
          VERSION_TAG: ${{ steps.meta.outputs.version_tag }}
          SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for repo in "ghcr.io/${OWNER}/dslf"; do
            runtime_srcs=$(printf "${repo}@sha256:%s " $(ls /tmp/digests/runtime))
            builder_srcs=$(printf "${repo}@sha256:%s " $(ls /tmp/digests/builder))

            echo "Runtime manifest for ${repo}"
            docker buildx imagetools create \
              --tag "${repo}:${VERSION_TAG}" \
              --tag "${repo}:${SHA}" \
              ${runtime_srcs}

            echo "Builder manifest for ${repo}"
            docker buildx imagetools create \
              --tag "${repo}:builder" \
              --tag "${repo}:builder-${VERSION_TAG}" \
              ${builder_srcs}
          done

      - name: Verify both architectures are present
        env:
          VERSION_TAG: ${{ steps.meta.outputs.version_tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # A manifest list missing an architecture would still pull fine on the
          # machine that built it, so check rather than assume.
          for tag in "ghcr.io/${OWNER}/dslf:${VERSION_TAG}" "ghcr.io/${OWNER}/dslf:builder"; do
            echo "== ${tag}"
            # Match the architecture names loosely: the raw manifest JSON is not
            # guaranteed to be formatted one particular way.
            out=$(docker buildx imagetools inspect "${tag}" --raw)
            echo "${out}" | grep -q 'amd64' || { echo "amd64 missing from ${tag}"; exit 1; }
            echo "${out}" | grep -q 'arm64' || { echo "arm64 missing from ${tag}"; exit 1; }
            echo "amd64 and arm64 both present"
          done
